name: Unsigned mobile builds

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/unsigned-mobile-build.yml'
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: false
        default: ''
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: unsigned-mobile-builds-${{ github.event.inputs.ref || github.ref_name }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  android:
    name: Android release APK
    if: github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.ref }}
          persist-credentials: false
      - name: Resolve checked-out source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: ./.github/actions/install-node-dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build unsigned release APK
        run: ./gradlew --init-script ../scripts/unsigned-android-release.gradle assembleRelease
        working-directory: mobile/android
      - name: Name and verify APK
        run: |
          set -euo pipefail
          version="$(node -p "require('./app.json').expo.version")"
          artifact="build/h0x-ade-mobile-${version}-android.apk"
          mkdir -p build
          mapfile -t apks < <(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk')
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release APK; found ${#apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" "$artifact"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          export AAPT2="$build_tools/aapt2"
          export APKSIGNER="$build_tools/apksigner"
          node scripts/verify-unsigned-mobile-artifact.mjs --platform android \
            --artifact "$artifact" --app-config app.json \
            --metadata-out build/android-artifact-metadata.json
      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: h0x-ade-mobile-android-${{ steps.source.outputs.sha }}
          path: |
            mobile/build/h0x-ade-mobile-*-android.apk
            mobile/build/h0x-ade-mobile-*-android.apk.sha256
            mobile/build/android-artifact-metadata.json
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator app
    if: github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.ref }}
          persist-credentials: false
      - name: Resolve checked-out source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        working-directory: .
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - uses: ./.github/actions/install-node-dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate iOS project
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: pnpm exec pod-install ios
      - name: Build unsigned simulator app
        run: >-
          xcodebuild -workspace ios/Orca.xcworkspace -scheme Orca
          -sdk iphonesimulator -configuration Release
          -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Archive and verify simulator app
        run: |
          set -euo pipefail
          version="$(node -p "require('./app.json').expo.version")"
          artifact="build/h0x-ade-mobile-${version}-ios-simulator.zip"
          app="build/ios/Build/Products/Release-iphonesimulator/Orca.app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$artifact"
          node scripts/verify-unsigned-mobile-artifact.mjs --platform ios \
            --artifact "$artifact" --app-config app.json \
            --metadata-out build/ios-artifact-metadata.json
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: h0x-ade-mobile-ios-simulator-${{ steps.source.outputs.sha }}
          path: |
            mobile/build/h0x-ade-mobile-*-ios-simulator.zip
            mobile/build/h0x-ade-mobile-*-ios-simulator.zip.sha256
            mobile/build/ios-artifact-metadata.json
          if-no-files-found: error
          retention-days: 14
